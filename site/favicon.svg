<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SYNTAX">
  <title>SYNTAX: three element types, one element chosen from each</title>
  <rect width="120" height="120" rx="6" fill="#0a1428"/>
  <g fill="#12213f">
    <rect x="44" y="4" width="32" height="32" rx="3"/><rect x="84" y="4" width="32" height="32" rx="3"/>
    <rect x="4" y="44" width="32" height="32" rx="3"/><rect x="44" y="44" width="32" height="32" rx="3"/>
    <rect x="4" y="84" width="32" height="32" rx="3"/><rect x="84" y="84" width="32" height="32" rx="3"/>
  </g>
  <rect x="4" y="4" width="32" height="32" rx="3" fill="#1848c0"/>
  <rect x="84" y="44" width="32" height="32" rx="3" fill="#1848c0"/>
  <rect x="44" y="84" width="32" height="32" rx="3" fill="#e8a53a"/>
</svg>
